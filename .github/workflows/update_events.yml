name: Update Gacha Events Data

on:
  schedule:
    # 格式為 POSIX cron (UTC 時間)
    # 此範例為每天 00:00, 06:00, 12:00, 18:00 (UTC) 定時執行
    - cron: '0 */6 * * *'
  workflow_dispatch: # 允許在 GitHub 介面上手動點擊按鈕觸發測試

# 必須賦予 Action 寫入儲存庫的權限
permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          pip install -r requirements.txt

      - name: 執行爬蟲腳本
        run: |
          python scripts/scraper.py

      - name: 檢查並提交變更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 檢查是否有檔案變動
          if git diff --quiet data/events.json; then
            echo "沒有檢測到資料變更，略過提交。"
          else
            git add data/events.json
            git commit -m "chore: 自動更新活動時程 [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
